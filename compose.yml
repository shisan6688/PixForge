services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_USE_DEMO_API: "true"
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
